<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎰 皇家百家樂 · 公共聊天室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #0a0f0d 0%, #1a1200 100%);
    color: #f5f0d8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 16px;
    background: linear-gradient(135deg, #1a2a20, #0d1f15);
    border-bottom: 2px solid #d4af37;
    text-align: center;
  }
  .header h1 {
    font-size: 20px;
    color: #d4af37;
  }
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 16px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    min-height: 400px;
    max-height: 60vh;
  }
  .chat-message {
    padding: 8px 12px;
    margin-bottom: 8px;
    background: rgba(45, 125, 210, 0.1);
    border-left: 3px solid #2d7dd2;
    border-radius: 6px;
    animation: fadeIn 0.3s;
  }
  .chat-message .user {
    color: #d4af37;
    font-weight: 800;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .chat-message .text {
    color: #f5f0d8;
    font-size: 14px;
    word-break: break-word;
  }
  .chat-message .time {
    color: #9fb8a4;
    font-size: 10px;
    margin-top: 2px;
  }
  .chat-input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
  }
  .chat-input-area input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2d7dd2;
    background: #0d1f15;
    color: #f5f0d8;
    font-size: 14px;
  }
  .chat-input-area button {
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #2d7dd2, #1e5c9e);
    color: #fff;
    font-weight: 800;
    cursor: pointer;
  }
  .chat-input-area button:active {
    transform: scale(0.95);
  }
  .nav {
    padding: 12px;
    text-align: center;
    background: rgba(0,0,0,0.3);
  }
  .nav a {
    color: #9fb8a4;
    text-decoration: none;
    font-size: 14px;
    margin: 0 12px;
  }
  .nav a:hover {
    color: #d4af37;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>💬 公共聊天室</h1>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="輸入訊息..." maxlength="200">
      <button onclick="sendMessage()">發送</button>
    </div>
  </div>

  <div class="nav">
    <a href="/rooms.html">🏠 房間</a>
    <a href="/">🎮 遊戲</a>
    <a href="/leaderboard.html">🏆 排行榜</a>
  </div>

  <script>
    let currentUser = null;
    async function loadUser() {
      try {
        const r = await fetch('/api/user');
        const j = await r.json();
        currentUser = j;
      } catch(e) {}
    }
    
    async function loadMessages() {
      try {
        const r = await fetch('/api/chat?room=lobby');
        const j = await r.json();
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        (j.messages || []).forEach(msg => {
          const div = document.createElement('div');
          div.className = 'chat-message';
          div.innerHTML = '<div class="user">' + escapeHtml(msg.user_id) + '</div>' +
                         '<div class="text">' + escapeHtml(msg.message) + '</div>' +
                         '<div class="time">' + new Date(msg.created_at).toLocaleString('zh-Hant') + '</div>';
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      } catch(e) {}
    }
    
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      try {
        const body = {room: 'lobby', message: msg};
        if (currentUser && currentUser.id && currentUser.id !== 'guest') body.id = currentUser.id;
        await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        input.value = '';
        loadMessages();
      } catch(e) {
        alert('發送失敗');
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Enter key to send
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    
    // Load messages every 3 seconds
    setInterval(loadMessages, 3000);
    
    // Initialize
    loadUser();
    loadMessages();
  </script>
</body>
</html>
