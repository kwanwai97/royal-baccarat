  .neg{color:#e23b3b;font-weight:700;}
  .bank0{color:#2faf5a;}
  .bankN{color:#e8a33d;}
  .delta{font-size:10px;font-weight:700;margin-top:1px;}
  .delta.dpos{color:#2faf5a;}
  .delta.dneg{color:#e23b3b;}
  .rchg{font-size:10px;font-weight:700;margin-top:1px;}
  .rchg.up{color:#2faf5a;}
  .rchg.down{color:#e23b3b;}
  .rchg.new{color:#e8a33d;}
  .streak{font-size:10px;line-height:1.3;}
  .streak .w{color:#2faf5a;}
  .streak .l{color:#e23b3b;}
  .spark{width:64px;height:20px;vertical-align:middle;}
  .ci{font-size:10px;color:#9a8fb5;}
  .tag{display:inline-block;background:#2a2138;border-radius:4px;padding:1px 5px;margin:1px;font-size:11px;}
  .loading{opacity:.6;}
</style>

<script>
const JSON_URLS = [
  'leaderboard.json',
  'http://localhost:8888/leaderboard.json',
  'http://192.168.0.105:8888/leaderboard.json'
];
const PERSONA_NAME = {banker:'死忠莊',player:'閒家膽',dragon:'追龍佬',road:'路單迷',gambler:'賭徒膽',granny:'保守婆',hot:'燥底哥',pro:'算牌神',million:'大戶豪',rookie:'初哥仔',analyst:'分析師',rebel:'反叛者'};
const AGE_NAME = {young:'青年',prime:'壯年',mid:'中年',senior:'資深',elder:'長者'};
const PLAN_NAME = {flat:'平注',martin:'倍投',seq1324:'1-3-2-4',fib:'斐波那契',kelly:'凱利',paroli:'帕羅利',labouchere:'拉布雪',dalerob:'達朗伯',contraiser:'逆向',grandmartin:'格蘭倍投',splitmartin:'分流倍投',whittacker:'惠特克'};

async function loadJSON(){
  for(const u of JSON_URLS){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(r.ok){ const d = await r.json(); d.__src='live'; return d; }
    }catch(e){ /* 試下一個 */ }
  }
  try{
    const el = document.getElementById('snapshot');
    if(el && el.textContent.trim()){ const d = JSON.parse(el.textContent); d.__src='snapshot'; return d; }
  }catch(e){}
  return null;
}

function fmt(n){ return (n>=0?'+':'') + n.toLocaleString('en-US'); }

// 資金曲線 mini SVG（平衡 5萬基準綠/紅）
function sparkline(hist){
  if(!hist || hist.length<2) return '<span class="ci">—</span>';
  const w=64,h=20,pad=2;
  const min=Math.min(...hist), max=Math.max(...hist);
  const rng=(max-min)||1;
  const pts=hist.map((v,i)=>{
    const x=pad+(w-2*pad)*i/(hist.length-1);
    const y=h-pad-(h-2*pad)*(v-min)/rng;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const up = hist[hist.length-1] >= hist[0];
  const col = up? '#2faf5a':'#e23b3b';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.2"/></svg>`;
}
// 勝率 95% 信心區間（Wilson score interval）
function wilson(wins, games){
  if(!games) return null;
  const z=1.96, p=wins/games, n=games;
  const denom=1+z*z/n;
  const centre=(p+z*z/(2*n))/denom;
  const half=(z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n)))/denom;
  return [Math.max(0,centre-half)*100, Math.min(1,centre+half)*100];
}

function render(db, sortBy){
  if(!db){ document.getElementById('board').innerHTML='<p>讀取失敗：請確認電腦後台 leaderboard.json 已生成，且 PC 起了 serve.py (端口8888)。</p>'; return; }
  const rows = db.roster.map(a=>{
    const wr = a.games? a.wins/a.games*100 : 0;
    const ci = wilson(a.wins, a.games);
    return Object.assign({}, a, {wr, ci});
  });
  rows.sort((x,y)=>{
    if(sortBy==='profit') return y.totalProfit - x.totalProfit;
    if(sortBy==='bankrupt') return x.bankrupt - y.bankrupt || y.totalProfit - x.totalProfit;
    if(sortBy==='winrate') return y.wr - x.wr;
    if(sortBy==='wager') return y.totalWager - x.totalWager;
    return 0;
  });
  let html = '<table><thead><tr><th>#</th><th>名稱</th><th>性格</th><th>年齡</th><th>注碼</th><th>總投注</th><th>總盈利</th><th>破產</th><th>局數</th><th>勝率</th><th>連勝/連敗</th><th>資金曲線</th><th>勝率區間</th></tr></thead><tbody>';
  rows.forEach((a,i)=>{
    const pc = a.totalProfit>=0?'pos':'neg';
    const bc = a.bankrupt===0?'bank0':'bankN';
    // 升跌：上鐘總盈利 vs 今鐘
    let dTxt='', dCls='';
    if(a.prevProfit!==undefined && a.prevProfit!==null){
      const d = Math.round(a.totalProfit - a.prevProfit);
      if(d>0){ dTxt='▲'+d.toLocaleString('en-US'); dCls='dpos'; }
      else if(d<0){ dTxt='▼'+Math.abs(d).toLocaleString('en-US'); dCls='dneg'; }
      else { dTxt='—'; dCls='dpos'; }
    } else { dTxt='新'; dCls='dpos'; }
    // 排名變動：上鐘排名 vs 今鐘(i+1)
    let rTxt='', rCls='';
    if(a.prevRank!==undefined && a.prevRank!==null){
      const chg = a.prevRank - (i+1);   // 正=升咗
      if(chg>0){ rTxt='↑'+chg; rCls='up'; }
      else if(chg<0){ rTxt='↓'+Math.abs(chg); rCls='down'; }
      else { rTxt='—'; rCls='up'; }
    } else { rTxt='新'; rCls='new'; }
    html += `<tr>
      <td>${i+1}<br><span class="rchg ${rCls}">${rTxt}</span></td>
      <td class="name">${a.name}</td>
      <td><span class="tag">${PERSONA_NAME[a.persona]||a.persona}</span></td>
      <td>${AGE_NAME[a.age]||a.age}</td>
      <td><span class="tag">${PLAN_NAME[a.plan]||a.plan}</span></td>
      <td>${a.totalWager.toLocaleString('en-US')}</td>
      <td class="${pc}">${fmt(a.totalProfit)}<br><span class="delta ${dCls}">${dTxt}</span></td>
      <td class="${bc}">${a.bankrupt}</td>
      <td>${a.games}</td>
      <td>${a.wr.toFixed(1)}%</td>
      <td><span class="streak"><span class="w">${a.maxWinStreak||0}連勝</span><br><span class="l">${Math.abs(a.maxLossStreak||0)}連敗</span></span></td>
      <td>${sparkline(a.balanceHistory)}</td>
      <td class="ci">${a.ci? a.ci[0].toFixed(1)+'~'+a.ci[1].toFixed(1)+'%':'—'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('board').innerHTML = html;
  document.getElementById('board').classList.remove('loading');
  if(db.__src==='snapshot'){
    document.getElementById('meta').innerHTML = `（離線快照 · 已跑 ${db.updated} 鐘 · ${db.roster.length} 個 AI · 非即時）`;
  } else {
    document.getElementById('meta').textContent = `（已跑 ${db.updated} 鐘 · ${db.roster.length} 個 AI）`;
  }
}

async function refresh(){
  const sortBy = document.getElementById('sortSel').value;
  document.getElementById('board').classList.add('loading');
  document.getElementById('board').textContent = '載入中…';
  const db = await loadJSON();
  render(db, sortBy);
}

document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('sortSel').addEventListener('change', refresh);
refresh();
</script>
