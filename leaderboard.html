<script>
const JSON_URLS = [
  'leaderboard.json',
  'http://localhost:8888/leaderboard.json',
  'http://192.168.0.105:8888/leaderboard.json'
];
const PERSONA_NAME = {banker:'死忠莊',player:'閒家膽',dragon:'追龍佬',road:'路單迷',gambler:'賭徒膽',granny:'保守婆',hot:'燥底哥',pro:'算牌神',million:'大戶豪',rookie:'初哥仔',analyst:'分析師',rebel:'反叛者'};
const AGE_NAME = {young:'青年',prime:'壯年',mid:'中年',senior:'資深',elder:'長者'};
const PLAN_NAME = {flat:'平注',martin:'倍投',seq1324:'1-3-2-4',fib:'斐波那契',kelly:'凱利',paroli:'帕羅利',labouchere:'拉布雪',dalerob:'達朗伯',contraiser:'逆向',grandmartin:'格蘭倍投',splitmartin:'分流倍投',whittacker:'惠特克'};

async function loadJSON(){
  for(const u of JSON_URLS){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(r.ok){ const d = await r.json(); d.__src='live'; return d; }
    }catch(e){ /* 試下一個 */ }
  }
  try{
    const el = document.getElementById('snapshot');
    if(el && el.textContent.trim()){ const d = JSON.parse(el.textContent); d.__src='snapshot'; return d; }
  }catch(e){}
  return null;
}

function fmt(n){ return (n>=0?'+':'') + n.toLocaleString('en-US'); }

function render(db, sortBy){
  if(!db){ document.getElementById('board').innerHTML='<p>讀取失敗：請確認電腦後台 leaderboard.json 已生成，且 PC 起了 serve.py (端口8888)。</p>'; return; }
  const rows = db.roster.map(a=>{
    const wr = a.games? a.wins/a.games*100 : 0;
    return Object.assign({}, a, {wr});
  });
  rows.sort((x,y)=>{
    if(sortBy==='profit') return y.totalProfit - x.totalProfit;
    if(sortBy==='bankrupt') return x.bankrupt - y.bankrupt || y.totalProfit - x.totalProfit;
    if(sortBy==='winrate') return y.wr - x.wr;
    if(sortBy==='wager') return y.totalWager - x.totalWager;
    return 0;
  });
  let html = '<table><thead><tr><th>#</th><th>名稱</th><th>性格</th><th>年齡</th><th>注碼</th><th>總投注</th><th>總盈利</th><th>破產</th><th>局數</th><th>勝率</th></tr></thead><tbody>';
  rows.forEach((a,i)=>{
    const pc = a.totalProfit>=0?'pos':'neg';
    const bc = a.bankrupt===0?'bank0':'bankN';
    html += `<tr>
      <td>${i+1}</td>
      <td class="name">${a.name}</td>
      <td><span class="tag">${PERSONA_NAME[a.persona]||a.persona}</span></td>
      <td>${AGE_NAME[a.age]||a.age}</td>
      <td><span class="tag">${PLAN_NAME[a.plan]||a.plan}</span></td>
      <td>${a.totalWager.toLocaleString('en-US')}</td>
      <td class="${pc}">${fmt(a.totalProfit)}</td>
      <td class="${bc}">${a.bankrupt}</td>
      <td>${a.games}</td>
      <td>${a.wr.toFixed(1)}%</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('board').innerHTML = html;
  document.getElementById('board').classList.remove('loading');
  if(db.__src==='snapshot'){
    document.getElementById('meta').innerHTML = `（離線快照 · 已跑 ${db.updated} 鐘 · ${db.roster.length} 個 AI · 非即時）`;
  } else {
    document.getElementById('meta').textContent = `（已跑 ${db.updated} 鐘 · ${db.roster.length} 個 AI）`;
  }
}

async function refresh(){
  const sortBy = document.getElementById('sortSel').value;
  document.getElementById('board').classList.add('loading');
  document.getElementById('board').textContent = '載入中…';
  const db = await loadJSON();
  render(db, sortBy);
}

document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('sortSel').addEventListener('change', refresh);
refresh();
</script>
