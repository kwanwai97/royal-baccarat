<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎰 皇家百家樂 · 房間大廳</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #0a0f0d 0%, #1a1200 100%);
    color: #f5f0d8;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 24px;
    color: #d4af37;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    margin-bottom: 8px;
  }
  .header p {
    font-size: 12px;
    color: #9fb8a4;
  }
  .room-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .room-card {
    background: linear-gradient(135deg, #1a2a20 0%, #0d1f15 100%);
    border: 2px solid #2faf5a;
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .room-card:active {
    transform: scale(0.98);
    border-color: #d4af37;
  }
  .room-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #d4af37, #2faf5a, #d4af37);
  }
  .room-name {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 8px;
  }
  .room-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #9fb8a4;
  }
  .room-players {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .room-players .avatars {
    display: flex;
  }
  .room-players .avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #2faf5a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    margin-left: -6px;
    border: 2px solid #1a2a20;
  }
  .room-players .avatar:first-child {
    margin-left: 0;
  }
  .room-status {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
  }
  .room-status.waiting {
    background: #2faf5a;
    color: #fff;
  }
  .room-status.playing {
    background: #d4af37;
    color: #1a1200;
  }
  .create-room {
    margin-top: 20px;
    text-align: center;
  }
  .create-btn {
    background: linear-gradient(135deg, #d4af37, #b8941f);
    color: #1a1200;
    border: none;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
  }
  .create-btn:active {
    transform: scale(0.95);
  }
  .nav {
    margin-top: 24px;
    text-align: center;
  }
  .nav a {
    color: #9fb8a4;
    text-decoration: none;
    font-size: 14px;
    margin: 0 12px;
  }
  .nav a:hover {
    color: #d4af37;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🎰 皇家百家樂 · 房間大廳</h1>
    <p>選擇房間加入，與其他玩家一起遊戲</p>
  </div>

  <div class="room-list" id="roomList">
    <div class="room-card" onclick="joinRoom('大廳')">
      <div class="room-name">🎉 大廳</div>
      <div class="room-info">
        <div class="room-players">
          <div class="avatars">
            <div class="avatar">👤</div>
            <div class="avatar">👤</div>
            <div class="avatar">👤</div>
          </div>
          <span>3 人在線</span>
        </div>
        <div class="room-status waiting">等待中</div>
      </div>
    </div>

    <div class="room-card" onclick="joinRoom('新手場')">
      <div class="room-name">🌱 新手場</div>
      <div class="room-info">
        <div class="room-players">
          <div class="avatars">
            <div class="avatar">👤</div>
            <div class="avatar">👤</div>
          </div>
          <span>2 人在線</span>
        </div>
        <div class="room-status waiting">等待中</div>
      </div>
    </div>

    <div class="room-card" onclick="joinRoom('高手場')">
      <div class="room-name">🔥 高手場</div>
      <div class="room-info">
        <div class="room-players">
          <div class="avatars">
            <div class="avatar">👤</div>
            <div class="avatar">👤</div>
            <div class="avatar">👤</div>
            <div class="avatar">👤</div>
          </div>
          <span>4 人在線</span>
        </div>
        <div class="room-status playing">遊戲中</div>
      </div>
    </div>

    <div class="room-card" onclick="joinRoom('VIP 房')">
      <div class="room-name">👑 VIP 房</div>
      <div class="room-info">
        <div class="room-players">
          <div class="avatars">
            <div class="avatar">👤</div>
          </div>
          <span>1 人在線</span>
        </div>
        <div class="room-status waiting">等待中</div>
      </div>
    </div>
  </div>

  <div class="create-room">
    <button class="create-btn" onclick="createRoom()">＋ 創建新房間</button>
  </div>

  <div class="nav">
    <a href="/">🎮 遊戲</a>
    <a href="/leaderboard.html">🏆 排行榜</a>
    <a href="/transactions.html">📊 記錄</a>
  </div>

  <script>
    function joinRoom(roomName) {
      localStorage.setItem('bac_room', roomName);
      window.location.href = '/?room=' + encodeURIComponent(roomName);
    }
    function createRoom() {
      const name = prompt('請輸入房間名稱：');
      if (name && name.trim()) {
        joinRoom(name.trim());
      }
    }
  </script>
</body>
</html>
