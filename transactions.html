<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎰 皇家百家樂 · 交易記錄</title>
<style>
  :root{--gold:#d4af37;--gold2:#f4d97b;--goldd:#b8860b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:radial-gradient(circle at 50% 0%,#1a1a1a,#000 70%);color:#f5f0d8;font-family:"PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{width:min(520px,94vw);background:linear-gradient(180deg,#1a1200,#0d0a00);border:2px solid var(--gold);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.7);}
  .title{text-align:center;color:var(--gold2);font-size:20px;font-weight:900;margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #2a3a30;vertical-align:top;}
  th{color:var(--gold2);font-weight:800;font-size:11px;opacity:.85;}
  .pos{color:#2faf5a;font-weight:700;}
  .neg{color:#e23b3b;font-weight:700;}
  .back{display:block;text-align:center;margin-top:12px;color:var(--gold2);text-decoration:none;font-size:12px;}
  .err{color:#ff9a9a;font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
  .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .sum-item{background:#0d1f15;border:1px solid #1c3a2a;border-radius:10px;padding:10px;text-align:center;}
  .sum-item .k{font-size:10px;color:#9fb8a4;}
  .sum-item .v{font-size:18px;font-weight:900;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title">📊 交易記錄</div>
    <div class="summary">
      <div class="sum-item"><div class="k">總充值</div><div class="v pos" id="totalIn">0</div></div>
      <div class="sum-item"><div class="k">總消費</div><div class="v neg" id="totalOut">0</div></div>
      <div class="sum-item"><div class="k">交易數</div><div class="v" id="totalCount">0</div></div>
    </div>
    <div style="overflow:auto;max-height:70vh;">
      <table>
        <thead>
          <tr><th>時間</th><th>類型</th><th>金額</th><th>備註</th></tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="err" id="err"></div>
    <a class="back" href="/">← 返回遊戲</a>
  </div>
</div>
<script>
async function load(){
  try{
    const r=await fetch('/api/user/transactions');
    const j=await r.json();
    if(!j.success){ document.getElementById('err').textContent=j.error||'載入失敗'; return; }
    const tb=document.getElementById('tb');
    tb.innerHTML='';
    let totalIn=0, totalOut=0;
    j.transactions.forEach(t=>{
      const dt = new Date(t.created_at).toLocaleString('zh-Hant');
      const amt = parseInt(t.amount||0);
      if(amt>0) totalIn+=amt; else totalOut+=amt;
      const cls = amt>0?'pos':'neg';
      const sign = amt>0?'+':'';
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${dt}</td><td>${t.type||''}</td><td class="${cls}">${sign}${amt}</td><td>${t.meta||''}</td></td>`;
      tb.appendChild(tr);
    });
    document.getElementById('totalIn').textContent=totalIn.toLocaleString();
    document.getElementById('totalOut').textContent=totalOut.toLocaleString();
    document.getElementById('totalCount').textContent=j.transactions.length;
  }catch(e){ document.getElementById('err').textContent='網絡錯誤'; }
}
load();
</script>
</body>
</html>
